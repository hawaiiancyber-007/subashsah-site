<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .panel { background: rgba(0,0,50,0.8); padding: 30px; border-radius: 10px; text-align: center; }
  input, button { padding: 10px; margin: 10px 0; width: 200px; border-radius: 6px; border: none; }
  button { background: #3b82f6; color: white; cursor: pointer; }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="panel">
    <h2>Admin Panel</h2>
    <input type="password" id="adminPass" placeholder="Enter Password">
    <br>
    <button id="toggleBtn">Toggle Site Live/Private</button>
    <p id="status"></p>
  </div>

<script>
const btn = document.getElementById('toggleBtn');
const status = document.getElementById('status');

btn.addEventListener('click', () => {
  const pass = document.getElementById('adminPass').value;
  fetch('/config.json')
    .then(res => res.json())
    .then(config => {
      if(pass === config.password){
        config.live = !config.live;
        fetch('/api/updateConfig.js', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(config)
        }).then(()=> status.textContent = config.live ? "Site is LIVE" : "Site is PRIVATE");
      } else {
        status.textContent = "Incorrect Password!";
      }
    });
});
</script>
</body>
</html>
